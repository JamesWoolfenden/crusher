on:
  push:
    branches:
      - main

name: CI
permissions: read-all
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  test:
    env:
      GOTOOLCHAIN: auto
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      ## runs go test ./...
      - name: Build
        run: go build ./...

      ## runs go test ./...
      - name: Test
        run: go test ./... -coverprofile=./cover.out

      - name: Upload coverage reports to Codecov
        # holden:ignore:HLD_CI_013: codecov-action reads CODECOV_TOKEN from env; step-scoped, not a workflow-wide secret
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies with picard
        uses: JamesWoolfenden/picard@296c590e3e1ed39567bd82aa84722c478883b156
        with:
          version: 296c590e3e1ed39567bd82aa84722c478883b156

  snapshot:
    env:
      GOTOOLCHAIN: auto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,sign
